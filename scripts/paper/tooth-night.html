<!doctype html><html><body style="margin:0;background:#000">
<!--
  Night-edition paper tooth: the same lit fractal-noise relief as tooth.html, but mapped to a dark
  layer (mostly black, faint light on the raised fibres) that is SCREENED onto black stock, so the
  surface catches a little light instead of darkening.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" style="display:block">
  <filter id="f" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="7" stitchTiles="stitch" result="noise"/>
    <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="1.5" result="lit">
      <feDistantLight azimuth="235" elevation="60"/>
    </feDiffuseLighting>
    <feColorMatrix in="lit" type="matrix"
      values="0.22 0 0 0 -0.12  0.21 0 0 0 -0.115  0.19 0 0 0 -0.105  0 0 0 0 1"/>
  </filter>
  <rect width="512" height="512" fill="#fff" filter="url(#f)"/>
</svg></body></html>
